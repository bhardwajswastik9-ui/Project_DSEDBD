services:
  # 1. FastAPI Gateway (Web Service)
  - type: web
    name: learning-gateway
    plan: free
    env: python
    rootDir: gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPRING_URL
        value: http://learning-spring-backend:10000
      - key: NODE_URL
        value: http://learning-node-backend:10000

  # 2. Spring Boot Backend (Web Service via Docker)
  - type: web
    name: learning-spring-backend
    plan: free
    env: docker
    rootDir: backend/learning-dashboard-backend
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: learning-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: learning-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: learning-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: learning-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: learning-postgres
          property: password

  # 3. Node.js Backend (Web Service)
  - type: web
    name: learning-node-backend
    plan: free
    env: node
    rootDir: backend/node-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # User will provide their MongoDB Atlas URI in the Render UI

  # 4. React Frontend (Static Site)
  - type: web
    name: learning-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GATEWAY_URL
        value: https://learning-gateway.onrender.com

databases:
  - name: learning-postgres
    plan: free
